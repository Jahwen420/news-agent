<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today's Headlines</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --soft: #8e8e93;
    --border: rgba(0, 0, 0, 0.06);
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.04);
    --shadow-hover: 0 2px 4px rgba(0,0,0,0.06), 0 12px 32px rgba(0,0,0,0.08);
    --chip-bg: transparent;
    --chip-border: rgba(0, 0, 0, 0.12);
    --chip-active: #1d1d1f;
    --chip-active-text: #ffffff;
    --must-color: #d32f2f;
    --worth-color: #b27d00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f10;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --muted: #98989d;
      --soft: #6e6e73;
      --border: rgba(255,255,255,0.08);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.25);
      --shadow-hover: 0 2px 4px rgba(0,0,0,0.35), 0 12px 32px rgba(0,0,0,0.4);
      --chip-border: rgba(255, 255, 255, 0.18);
      --chip-active: #f5f5f7;
      --chip-active-text: #1d1d1f;
      --must-color: #ff7a7a;
      --worth-color: #e0b84a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI",
                 Roboto, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px 80px; }
  @media (min-width: 768px) { .wrap { padding: 32px 24px 96px; } }

  header { padding: 8px 0 12px; }
  .title-row {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px;
  }
  header h1 {
    font-size: 24px; font-weight: 700;
    letter-spacing: -0.02em; margin: 0;
  }
  @media (min-width: 768px) { header h1 { font-size: 32px; } }
  header .meta { font-size: 13px; color: var(--muted); margin-top: 4px; }
  /* 带文字的描边按钮:移动端也保留 "Refresh" label,不退化为图标 */
  #refresh {
    display: inline-flex; align-items: center;
    gap: 6px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 14px; font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow);
    flex-shrink: 0;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }
  #refresh:hover  { transform: translateY(-1px); box-shadow: var(--shadow-hover); border-color: var(--text); }
  #refresh:active { transform: scale(0.98); }
  #refresh:disabled { opacity: 0.6; cursor: wait; transform: none; box-shadow: var(--shadow); }
  #refresh .rr-icon { display: inline-block; font-size: 14px; line-height: 1; }
  /* spinning 只转 icon,文字保持静止 */
  #refresh.spinning .rr-icon { animation: spin 1s linear infinite; }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

  /* sticky 横向滚动筛选条 */
  .filter-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    margin: 8px -16px 16px;
    padding: 8px 0;
  }
  @media (min-width: 768px) { .filter-bar { margin: 12px 0 20px; padding: 0; } }
  .chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px 16px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  @media (min-width: 768px) {
    .chips { flex-wrap: wrap; overflow-x: visible; padding: 0; }
  }
  .chip {
    flex-shrink: 0;
    padding: 7px 14px;
    border-radius: 999px;
    background: var(--chip-bg);
    border: 1px solid var(--chip-border);
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .chip:hover { border-color: var(--text); }
  .chip.active {
    background: var(--chip-active);
    color: var(--chip-active-text);
    border-color: var(--chip-active);
  }

  /* 文章卡片 */
  .feed { display: flex; flex-direction: column; gap: 10px; }
  article {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  @media (min-width: 768px) { article { padding: 18px 20px; } }
  article:active { transform: scale(0.99); }
  @media (hover: hover) {
    article:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
  }
  /* 卡片整体改成水平 flex,缩略图在右,有图无图都用同一套布局 */
  article {
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .card-body { flex: 1; min-width: 0; }
  article a { color: inherit; text-decoration: none; display: block; }
  article a:hover .title { text-decoration: underline; text-decoration-thickness: 1px; }

  /* 顶部一行:左=来源·立场+i,右=时间 */
  .card-top {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
  }
  .src-line {
    font-weight: 500;
    display: inline-flex; align-items: center; gap: 2px;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .time-ago { font-weight: 500; color: var(--soft); flex-shrink: 0; }

  .title {
    font-size: 16px; font-weight: 600;
    margin-top: 6px; letter-spacing: -0.01em;
    line-height: 1.4;
  }
  @media (min-width: 768px) { .title { font-size: 18px; } }
  .summary-en {
    font-size: 14px; color: var(--muted);
    margin-top: 8px; line-height: 1.5;
  }

  /* 底部行:仅 must_read / worth_knowing 才渲染,if_time 整段不输出 */
  .card-bottom { margin-top: 10px; }
  .importance { font-size: 12px; font-weight: 600; }
  .importance.must-read     { color: var(--must-color); }
  .importance.worth-knowing { color: var(--worth-color); }

  /* 缩略图:右侧固定方块,object-fit:cover 裁剪 */
  .thumb {
    width: 80px; height: 80px;
    border-radius: 10px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--border);
  }
  @media (min-width: 768px) {
    .thumb { width: 120px; height: 120px; }
  }

  /* Load more:primary action,mobile 满宽,desktop 居中 240px */
  .load-more-wrap { margin-top: 28px; display: flex; justify-content: center; }
  .load-more {
    display: block;
    width: 100%;
    background: var(--chip-active);
    color: var(--chip-active-text);
    border: none;
    padding: 14px 24px;
    border-radius: 12px;
    font-size: 15px; font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.01em;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }
  .load-more:hover  { transform: translateY(-1px); box-shadow: var(--shadow-hover); opacity: 0.92; }
  .load-more:active { transform: scale(0.99); }
  @media (min-width: 768px) {
    .load-more { width: auto; min-width: 240px; }
  }

  /* "i" 信息按钮:小、轻、与周围文字同色,只在 hover/focus 时出 tooltip */
  .bias-info {
    all: unset;
    display: inline-flex; align-items: center; justify-content: center;
    width: 11px; height: 11px;
    margin-left: 3px;
    border-radius: 999px;
    border: 1px solid currentColor;
    color: var(--soft);
    font-size: 8px; font-weight: 700;
    cursor: help;
    position: relative;
    line-height: 1;
    opacity: 0.7;
  }
  .bias-info:hover, .bias-info:focus { opacity: 1; }
  .bias-info > span { font-style: italic; }
  .bias-info::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg);
    padding: 7px 10px; border-radius: 8px;
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.2px; text-transform: none;
    white-space: nowrap; max-width: 80vw;
    opacity: 0; pointer-events: none;
    transition: opacity 0.15s ease;
    z-index: 100;
    box-shadow: var(--shadow);
  }
  .bias-info:hover::after,
  .bias-info:focus::after,
  .bias-info:focus-visible::after { opacity: 1; }

  .empty {
    text-align: center; padding: 60px 16px;
    color: var(--muted); font-size: 15px;
  }

  .toast {
    position: fixed;
    bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg);
    padding: 10px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 500;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    max-width: calc(100vw - 32px);
    box-shadow: var(--shadow-hover);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-row">
      <h1>Today's Headlines</h1>
      <button id="refresh" type="button" aria-label="Refresh news">
        <span class="rr-icon" aria-hidden="true">🔄</span>
        <span class="rr-label">Refresh</span>
      </button>
    </div>
    <div class="meta" id="ts">Loading…</div>
  </header>

  <nav class="filter-bar" aria-label="Filters">
    <div class="chips" id="chips">
      <button class="chip active" data-filter="all">All</button>
      <button class="chip" data-filter="topic:Geopolitics">🌍 Geopolitics</button>
      <button class="chip" data-filter="topic:Business">💰 Business</button>
      <button class="chip" data-filter="topic:Tech">💻 Tech</button>
      <button class="chip" data-filter="topic:China">🇨🇳 China</button>
      <button class="chip" data-filter="topic:Japan">🇯🇵 Japan</button>
      <button class="chip" data-filter="topic:Science">🔬 Science</button>
      <button class="chip" data-filter="topic:Other">📰 Other</button>
    </div>
  </nav>

  <main class="feed" id="list">
    <div class="empty">Loading…</div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
  // ─── 常量映射:importance 的展示 ────────────────────────────────────────
  const IMP = {
    must_read:     ["🔥", "Must read",     "must-read"],
    worth_knowing: ["📌", "Worth knowing", "worth-knowing"],
    if_time:       ["💡", "If time",       "if-time"],
  };
  // 用于跨主题/筛选视图的稳定重要性排序
  const IMP_RANK = { must_read: 0, worth_knowing: 1, if_time: 2 };

  // AllSides Media Bias Chart 评级,前端展示用(不污染数据层)
  const SOURCE_BIAS = {
    "BBC":         "Lean Left",
    "NPR":         "Lean Left",
    "Guardian":    "Left",
    "Nikkei Asia": "Center",
    "SCMP":        "Center",
  };
  const BIAS_TOOLTIP = "Political lean rating based on AllSides Media Bias Chart.";

  const PAGE_SIZE = 15;
  const state = { articles: [], filter: "all", visible: PAGE_SIZE, refreshing: false };

  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
    (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove("show"), 3000);
  }

  // ─── 相对时间格式化:统一 13m / 3h / 2d 风格 ────────────────────────────
  function relativeTime(iso) {
    if (!iso) return "";
    const t = new Date(iso).getTime();
    if (isNaN(t)) return "";
    const diff = Date.now() - t;
    if (diff < 0) return "just now";
    const min = Math.floor(diff / 60000);
    if (min < 1)  return "just now";
    if (min < 60) return min + "m ago";
    const hr = Math.floor(min / 60);
    if (hr < 24)  return hr + "h ago";
    const day = Math.floor(hr / 24);
    if (day < 7)  return day + "d ago";
    return new Date(iso).toLocaleDateString();
  }

  function filteredAndSorted() {
    const f = state.filter;
    let arr = state.articles;
    if (f.startsWith("imp:"))        arr = arr.filter(a => a.importance === f.slice(4));
    else if (f.startsWith("topic:")) arr = arr.filter(a => a.topic === f.slice(6));
    // 任何视图(All / 主题 / 重要性)都按 importance 排序;同级按 published_at 倒序
    return [...arr].sort((a, b) => {
      const ra = IMP_RANK[a.importance] ?? 3;
      const rb = IMP_RANK[b.importance] ?? 3;
      if (ra !== rb) return ra - rb;
      const ta = a.published_at ? new Date(a.published_at).getTime() : 0;
      const tb = b.published_at ? new Date(b.published_at).getTime() : 0;
      return tb - ta;
    });
  }

  function renderCard(a) {
    const [iE, iL, iC] = IMP[a.importance] || ["", "", ""];
    const bias = SOURCE_BIAS[a.source];
    // published_at 缺失则不渲染时间(不留占位)
    const rel = relativeTime(a.published_at);
    const timeHtml = rel ? `<span class="time-ago">${esc(rel)}</span>` : "";
    // 来源 · 立场,中点分隔;i 按钮悬停看 AllSides 提示
    const biasPart = bias
      ? ` · ${esc(bias)}<button class="bias-info" type="button" aria-label="About bias rating" data-tooltip="${esc(BIAS_TOOLTIP)}"><span>i</span></button>`
      : "";
    // 仅 must_read / worth_knowing 才显示底部重要性提示;if_time 整段不输出
    const showImportance = a.importance === "must_read" || a.importance === "worth_knowing";
    const importanceHtml = showImportance
      ? `<div class="card-bottom"><span class="importance ${iC}">${iE} ${esc(iL)}</span></div>`
      : "";
    // og:image 缺失则不渲染 <img>,卡片自然回退到无缩略图布局
    const thumbHtml = a.og_image
      ? `<img class="thumb" src="${esc(a.og_image)}" loading="lazy" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`
      : "";
    return `
      <article>
        <div class="card-body">
          <div class="card-top">
            <span class="src-line">${esc(a.source)}${biasPart}</span>
            ${timeHtml}
          </div>
          <a href="${esc(a.url)}" target="_blank" rel="noopener">
            <div class="title">${esc(a.title)}</div>
          </a>
          <div class="summary-en">${esc(a.summary_en)}</div>
          ${importanceHtml}
        </div>
        ${thumbHtml}
      </article>`;
  }

  function render() {
    const filtered = filteredAndSorted();
    const list = $("#list");
    if (!filtered.length) {
      const msg = state.articles.length
        ? "No articles match this filter."
        : "No data yet — click 🔄 to fetch.";
      list.innerHTML = `<div class="empty">${msg}</div>`;
      return;
    }
    const shown = filtered.slice(0, state.visible);
    const remaining = filtered.length - shown.length;
    const more = remaining > 0
      ? `<div class="load-more-wrap"><button class="load-more" id="loadMore">Load more (${remaining} remaining)</button></div>`
      : "";
    list.innerHTML = shown.map(renderCard).join("") + more;
    const btn = document.getElementById("loadMore");
    if (btn) btn.addEventListener("click", loadMore);
  }

  function loadMore() {
    state.visible += PAGE_SIZE;
    render();
  }

  function setFilter(f) {
    state.filter = f;
    state.visible = PAGE_SIZE;  // 切换 filter 时重置分页
    document.querySelectorAll(".chip").forEach(c => {
      c.classList.toggle("active", c.dataset.filter === f);
    });
    render();
  }

  function setTs(iso) {
    $("#ts").textContent = iso
      ? "Updated " + new Date(iso).toLocaleString()
      : "No data yet";
  }

  async function loadNews() {
    try {
      const r = await fetch("/api/news");
      const data = await r.json();
      state.articles = data.articles || [];
      setTs(data.updated_at);
      render();
    } catch (e) {
      toast("Load failed: " + e.message);
    }
  }

  async function doRefresh() {
    if (state.refreshing) return;
    state.refreshing = true;
    const btn = $("#refresh");
    const label = btn.querySelector(".rr-label");
    btn.disabled = true;
    btn.classList.add("spinning");
    label.textContent = "Refreshing…";
    try {
      const r = await fetch("/api/refresh", { method: "POST" });
      if (!r.ok) {
        const err = await r.json().catch(() => ({ detail: r.statusText }));
        throw new Error(err.detail || `HTTP ${r.status}`);
      }
      const data = await r.json();
      state.articles = data.articles || [];
      setTs(data.updated_at);
      render();
      // 后端返回 stats 时,显示这次到底新增了多少;auto-hide 3s by toast()
      const s = data.stats;
      if (s && typeof s.new === "number") {
        toast(s.new > 0
          ? `Added ${s.new} new article${s.new === 1 ? "" : "s"}`
          : "No new articles since last refresh");
      } else {
        toast(`Loaded ${state.articles.length} headlines`);
      }
    } catch (e) {
      toast("Refresh failed: " + e.message);
    } finally {
      state.refreshing = false;
      btn.disabled = false;
      btn.classList.remove("spinning");
      label.textContent = "Refresh";
    }
  }

  // ─── 事件绑定 + 启动 ────────────────────────────────────────────────────
  document.querySelectorAll(".chip").forEach(c => {
    c.addEventListener("click", () => setFilter(c.dataset.filter));
  });
  $("#refresh").addEventListener("click", doRefresh);
  loadNews();
</script>
</body>
</html>
