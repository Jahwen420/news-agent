<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loop.</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --soft: #8e8e93;
    --border: rgba(0, 0, 0, 0.06);
    --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 20px rgba(0,0,0,0.05);
    --shadow-hover: 0 2px 6px rgba(0,0,0,0.06), 0 12px 36px rgba(0,0,0,0.09);
    --chip-bg: transparent;
    --chip-border: rgba(0, 0, 0, 0.12);
    --chip-active: #1d1d1f;
    --chip-active-text: #ffffff;
    --must-color: #c62828;
    --worth-color: #b27d00;
    --accent: #5B5FDE;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f10;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --muted: #98989d;
      --soft: #6e6e73;
      --border: rgba(255,255,255,0.08);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.25);
      --shadow-hover: 0 2px 4px rgba(0,0,0,0.35), 0 12px 32px rgba(0,0,0,0.4);
      --chip-border: rgba(255, 255, 255, 0.18);
      --chip-active: #f5f5f7;
      --chip-active-text: #1d1d1f;
      --must-color: #ff7a7a;
      --worth-color: #e0b84a;
      --accent: #7B7FFF;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI",
                 Roboto, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 80px; }
  @media (min-width: 768px) { .wrap { padding: 0 24px 96px; } }

  /* ─── Hero — mobile-first ────────────────────────────────────────── */
  .hero { padding: 32px 0 16px; }
  @media (min-width: 600px)  { .hero { padding: 48px 0 32px; } }
  @media (min-width: 768px)  { .hero { padding: 96px 0 48px; } }

  .hero-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  @media (min-width: 600px) { .hero-nav { margin-bottom: 36px; } }

  .brand {
    font-size: 15px; font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  /* "Loop" rotates on Pull latest; the trailing "." stays put */
  .brand-loop { display: inline-block; transform-origin: 50% 55%; }
  @keyframes loop-spin {
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .brand-loop.logo-spinning { animation: loop-spin 0.7s cubic-bezier(0.4, 0, 0.2, 1); }

  .hero-headline {
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.15;
    max-width: 640px;
    margin: 0 0 12px;
    color: var(--text);
  }
  @media (min-width: 600px) { .hero-headline { font-size: 32px; margin-bottom: 16px; } }
  @media (min-width: 768px) { .hero-headline { font-size: 48px; } }

  /* Hide subhead on narrow mobile to save vertical space */
  .hero-sub { display: none; }
  @media (min-width: 600px) {
    .hero-sub {
      display: block;
      font-size: 18px;
      color: var(--muted);
      max-width: 500px;
      margin: 0;
      line-height: 1.55;
    }
  }

  /* ─── Language nudge banner ─────────────────────────────────────── */
  .lang-nudge {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 20px;
    font-size: 13px; color: var(--muted);
    box-shadow: var(--shadow);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  @media (min-width: 600px) { .lang-nudge { margin-bottom: 28px; } }
  .lang-nudge--hidden {
    opacity: 0; pointer-events: none;
    transform: translateY(-6px);
    /* keep in flow while hidden so layout doesn't jump */
    visibility: hidden;
  }
  .lang-nudge-btn {
    all: unset;
    display: inline-block;
    cursor: pointer;
    font-size: 13px; font-weight: 600;
    color: var(--accent);
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s ease;
  }
  .lang-nudge-btn:hover { border-bottom-color: var(--accent); }
  .lang-nudge-close {
    all: unset;
    display: inline-flex; align-items: center; justify-content: center;
    margin-left: auto;
    width: 20px; height: 20px;
    cursor: pointer;
    color: var(--soft);
    font-size: 16px; line-height: 1;
    border-radius: 4px;
    transition: color 0.15s ease;
    flex-shrink: 0;
  }
  .lang-nudge-close:hover { color: var(--text); }

  /* ─── Actions: lang switcher + refresh ───────────────────────────── */
  .actions { display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .lang-switcher {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
    background: var(--card);
    box-shadow: var(--shadow);
  }
  .lang-switcher button {
    background: transparent; border: none;
    color: var(--muted);
    font-family: inherit;
    font-size: 12px; font-weight: 600;
    padding: 6px 10px;
    cursor: pointer; line-height: 1;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .lang-switcher button:hover { color: var(--text); }
  .lang-switcher button.active {
    background: var(--chip-active);
    color: var(--chip-active-text);
  }
  @media (max-width: 400px) {
    .lang-switcher button { padding: 6px 8px; font-size: 11px; }
  }

  #refresh {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 14px; font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow);
    flex-shrink: 0;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }
  #refresh:hover  { transform: translateY(-1px); box-shadow: var(--shadow-hover); border-color: var(--text); }
  #refresh:active { transform: scale(0.98); }
  #refresh:disabled { opacity: 0.6; cursor: wait; transform: none; box-shadow: var(--shadow); }
  #refresh .rr-icon { display: inline-block; font-size: 14px; line-height: 1; }
  #refresh.spinning .rr-icon { animation: spin 1s linear infinite; }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

  /* ─── Today's Brief ──────────────────────────────────────────────── */
  .brief-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  @media (min-width: 768px) { .brief-section { padding: 20px; margin-bottom: 16px; } }

  .brief-header {
    display: flex; align-items: baseline; gap: 6px;
    margin-bottom: 14px;
  }
  .brief-title-label {
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .brief-date-label {
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .brief-item {
    display: flex; gap: 14px; align-items: flex-start;
    padding: 12px 0;
    border-top: 1px solid var(--border);
    text-decoration: none; color: inherit;
  }
  .brief-item:first-of-type { border-top: none; padding-top: 0; }
  .brief-item:last-of-type  { padding-bottom: 0; }
  @media (min-width: 768px) { .brief-item { padding: 14px 0; } }

  .brief-emoji {
    font-size: 22px; line-height: 1.2;
    flex-shrink: 0;
    margin-top: 1px;
    width: 26px; text-align: center;
  }
  @media (min-width: 768px) { .brief-emoji { font-size: 24px; width: 28px; } }

  .brief-content { flex: 1; min-width: 0; }
  .brief-label {
    font-size: 11px; font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .brief-framing {
    font-size: 16px; font-weight: 400;
    line-height: 1.4; color: var(--text);
    transition: color 0.15s ease;
  }
  @media (min-width: 768px) { .brief-framing { font-size: 17px; } }
  @media (hover: hover) { .brief-item:hover .brief-framing { color: var(--accent); } }
  /* When the brief item has no valid URL we render a <div> instead of <a>
     — kill any pointer/hover affordance so users don't try to click it. */
  .brief-item--nolink { cursor: default; }
  @media (hover: hover) { .brief-item--nolink:hover .brief-framing { color: var(--text); } }

  .brief-empty {
    font-size: 14px; color: var(--muted);
    text-align: center;
    padding: 4px 0 2px;
  }

  /* Skeleton pulse */
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  .brief-skel-item {
    display: flex; gap: 14px; align-items: flex-start;
    padding: 12px 0;
    border-top: 1px solid var(--border);
  }
  .brief-skel-item:first-child { border-top: none; padding-top: 0; }
  .brief-skel-item:last-child  { padding-bottom: 0; }
  .brief-skel-emoji {
    width: 26px; height: 26px; border-radius: 6px;
    background: var(--border); flex-shrink: 0;
    animation: pulse 1.6s ease-in-out infinite;
  }
  .brief-skel-body { flex: 1; }
  .brief-skel-line {
    height: 10px; border-radius: 4px;
    background: var(--border);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .brief-skel-lbl   { width: 38%; height: 10px; margin-bottom: 10px; }
  .brief-skel-txt1  { width: 92%; height: 14px; margin-bottom: 6px; }
  .brief-skel-txt2  { width: 62%; height: 14px; }

  /* ─── Sticky filter bar ───────────────────────────────────────────── */
  .filter-bar {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    margin: 0 -16px 0;
    padding: 8px 0;
  }
  @media (min-width: 768px) { .filter-bar { margin: 0; padding: 0; } }
  .chips {
    display: flex; gap: 8px;
    overflow-x: auto;
    padding: 2px 16px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    /* Soft fade on the right edge so users notice the chip strip scrolls.
       Only on mobile — desktop wraps, so no fade needed. */
    -webkit-mask-image: linear-gradient(to right, black calc(100% - 24px), transparent);
            mask-image: linear-gradient(to right, black calc(100% - 24px), transparent);
  }
  .chips::-webkit-scrollbar { display: none; }
  @media (min-width: 768px) {
    .chips {
      flex-wrap: wrap; overflow-x: visible; padding: 0;
      -webkit-mask-image: none;
              mask-image: none;
    }
  }
  .chip {
    flex-shrink: 0;
    padding: 7px 14px; border-radius: 999px;
    background: var(--chip-bg);
    border: 1px solid var(--chip-border);
    color: var(--text);
    font-size: 14px; font-weight: 500;
    white-space: nowrap; cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .chip:hover { border-color: var(--text); }
  .chip.active {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }
  /* Keyboard focus rings — visible only via keyboard nav, not on click. */
  .chip:focus-visible,
  #refresh:focus-visible,
  .lang-switcher button:focus-visible,
  .translate-btn:focus-visible,
  .load-more:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* Meta line below filter chips */
  .feed-meta {
    font-size: 13px; color: var(--muted);
    letter-spacing: -0.005em;
    margin: 8px 0 10px;
    padding: 0 2px;
    min-height: 1em;
  }

  /* ─── Cards ───────────────────────────────────────────────────────── */
  .feed { display: flex; flex-direction: column; gap: 10px; }
  article {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 16px;
    box-shadow: var(--shadow);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    display: flex; gap: 12px; align-items: flex-start;
  }
  @media (min-width: 768px) { article { padding: 20px; gap: 14px; } }
  article:active { transform: scale(0.99); }
  @media (hover: hover) {
    article:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }
  }

  .card-body { flex: 1; min-width: 0; }
  article a { color: inherit; text-decoration: none; display: block; }

  .card-top {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; line-height: 1.4;
  }
  .src-line {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--muted);
    display: inline-flex; align-items: center; gap: 2px;
    /* No overflow:hidden — was clipping the .bias-info::after tooltip.
       Source names are short enough (BBC / NPR / Guardian / Nikkei Asia
       / SCMP) that we don't need ellipsis here. */
    min-width: 0; white-space: nowrap;
  }
  .time-ago { font-size: 11px; font-weight: 500; color: var(--soft); flex-shrink: 0; }

  /* Title: left-to-right underline on hover */
  .title {
    font-size: 16px; font-weight: 600;
    margin-top: 6px; letter-spacing: -0.01em;
    line-height: 1.4;
    background-image: linear-gradient(currentColor, currentColor);
    background-position: 0 100%;
    background-repeat: no-repeat;
    background-size: 0% 1px;
    transition: background-size 0.25s ease;
  }
  @media (min-width: 768px) { .title { font-size: 18px; } }
  article a:hover .title { background-size: 100% 1px; }

  .summary-en {
    font-size: 14px; color: var(--muted);
    margin-top: 8px; line-height: 1.5;
  }

  .card-bottom {
    margin-top: 10px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  .importance { font-size: 12px; font-weight: 600; }
  .importance.must-read     { color: var(--must-color); }
  .importance.worth-knowing { color: var(--worth-color); }
  .importance-spacer { flex: 1; }

  .translate-wrap { position: relative; }
  .translate-btn {
    background: transparent; border: none;
    color: var(--muted);
    font-family: inherit;
    font-size: 12px; font-weight: 500;
    cursor: pointer; padding: 2px 0;
    transition: color 0.15s ease;
  }
  .translate-btn:hover { color: var(--text); text-decoration: underline; }
  .translate-btn:disabled { opacity: 0.55; cursor: wait; text-decoration: none; }

  .translate-menu {
    position: absolute;
    bottom: calc(100% + 6px); right: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow-hover);
    padding: 4px;
    z-index: 50;
    display: flex; flex-direction: column; gap: 2px;
    min-width: 110px;
  }
  .translate-menu button {
    background: transparent; border: none;
    text-align: left; padding: 6px 10px;
    font-size: 13px; cursor: pointer;
    border-radius: 6px; font-family: inherit;
    color: var(--text); white-space: nowrap;
  }
  .translate-menu button:hover { background: var(--bg); }

  /* Article skeleton cards — shown on first /api/news load to avoid a
     blank-screen flash. Same shape as a real card; pulses subtly. */
  .card-skel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 16px;
    box-shadow: var(--shadow);
    display: flex; gap: 12px; align-items: flex-start;
  }
  @media (min-width: 768px) { .card-skel { padding: 20px; gap: 14px; } }
  .card-skel .card-body { flex: 1; min-width: 0; }
  .card-skel-top {
    display: flex; justify-content: space-between; gap: 12px;
    margin-bottom: 10px;
  }
  .card-skel-bar {
    height: 10px; border-radius: 4px;
    background: var(--border);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .card-skel-src   { width: 80px; }
  .card-skel-time  { width: 48px; }
  .card-skel-title { width: 92%; height: 14px; margin-bottom: 6px; }
  .card-skel-title2{ width: 60%; }
  .card-skel-sum   { width: 100%; height: 10px; margin-top: 10px; margin-bottom: 4px; }
  .card-skel-sum2  { width: 70%; }
  .card-skel-thumb {
    width: 72px; height: 72px; border-radius: 10px;
    background: var(--border); flex-shrink: 0;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @media (min-width: 768px) {
    .card-skel-thumb { width: 120px; height: 120px; }
  }

  /* Talking points (collapsible per-card section) */
  .talking-points-wrap {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .talking-points-toggle {
    all: unset;
    cursor: pointer;
    font-size: 12px; font-weight: 500;
    color: var(--muted);
    transition: color 0.15s ease;
    padding: 2px 0;
  }
  .talking-points-toggle:hover { color: var(--text); }
  .talking-points-toggle:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 4px;
  }
  /* Grid-row trick: 0fr → 1fr animates from height 0 to "auto" smoothly,
     no magic max-height number, never clips long content. */
  .talking-points-collapse {
    display: grid;
    grid-template-rows: 0fr;
    margin-top: 0;
    transition: grid-template-rows 0.3s ease, margin-top 0.3s ease;
  }
  .talking-points-collapse.expanded {
    grid-template-rows: 1fr;
    margin-top: 8px;
  }
  .talking-points {
    overflow: hidden;
    min-height: 0;
  }
  .talking-point {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.55;
    padding-left: 14px;
    position: relative;
    margin-bottom: 6px;
    letter-spacing: -0.005em;
  }
  .talking-point::before {
    content: "·";
    position: absolute;
    left: 3px; top: -1px;
    font-size: 16px; font-weight: 700;
    color: var(--soft);
    line-height: 1.55;
  }
  .talking-point:last-child { margin-bottom: 0; }

  /* Thumbnail */
  .thumb {
    width: 72px; height: 72px;
    border-radius: 10px; object-fit: cover;
    flex-shrink: 0; background: var(--border);
  }
  @media (min-width: 768px) { .thumb { width: 120px; height: 120px; } }

  /* Load more */
  .load-more-wrap { margin-top: 28px; display: flex; justify-content: center; }
  .load-more {
    display: block; width: 100%;
    background: var(--accent); color: #ffffff;
    border: none;
    padding: 14px 24px; border-radius: 12px;
    font-size: 15px; font-weight: 600; font-family: inherit;
    cursor: pointer; letter-spacing: 0.01em;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }
  .load-more:hover  { transform: translateY(-1px); box-shadow: var(--shadow-hover); opacity: 0.92; }
  .load-more:active { transform: scale(0.99); }
  @media (min-width: 768px) { .load-more { width: auto; min-width: 240px; } }

  /* Bias info "i" */
  .bias-info {
    all: unset;
    display: inline-flex; align-items: center; justify-content: center;
    width: 11px; height: 11px; margin-left: 3px;
    border-radius: 999px; border: 1px solid currentColor;
    color: var(--soft);
    font-size: 8px; font-weight: 700;
    cursor: help; position: relative; line-height: 1; opacity: 0.7;
  }
  .bias-info:hover, .bias-info:focus { opacity: 1; }
  .bias-info > span { font-style: italic; }
  .bias-info::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg);
    padding: 7px 10px; border-radius: 8px;
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.2px; text-transform: none;
    white-space: nowrap; max-width: 80vw;
    opacity: 0; pointer-events: none;
    transition: opacity 0.15s ease;
    z-index: 100; box-shadow: var(--shadow);
  }
  .bias-info:hover::after,
  .bias-info:focus::after,
  .bias-info:focus-visible::after { opacity: 1; }

  /* Empty + Toast */
  .empty {
    text-align: center; padding: 60px 16px;
    color: var(--muted); font-size: 15px;
  }
  .toast {
    position: fixed;
    bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg);
    padding: 10px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 500;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    max-width: calc(100vw - 32px);
    box-shadow: var(--shadow-hover);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">

  <!-- ── Hero (compressed on mobile) ── -->
  <section class="hero">
    <div class="hero-nav">
      <span class="brand"><span class="brand-loop">Loop</span>.</span>
      <div class="actions">
        <div class="lang-switcher" id="langSwitcher" role="group" aria-label="Language">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="zh">中</button>
          <button type="button" data-lang="ja">日</button>
        </div>
        <button id="refresh" type="button" aria-label="Pull latest">
          <span class="rr-icon" aria-hidden="true">🔄</span>
          <span class="rr-label">Pull latest</span>
        </button>
      </div>
    </div>
    <div id="langNudge" class="lang-nudge lang-nudge--hidden" role="status" aria-live="polite">
      🌐 Also available in
      <button type="button" class="lang-nudge-btn" data-lang="zh">中文</button>
      and
      <button type="button" class="lang-nudge-btn" data-lang="ja">日本語</button>
      <button type="button" class="lang-nudge-close" aria-label="Dismiss">×</button>
    </div>
    <h1 class="hero-headline" id="heroHeadline">Don't be the last one to know.</h1>
    <p class="hero-sub" id="heroSub">AI-curated news with talking points ready for tonight's dinner.</p>
  </section>

  <!-- ── Today's Brief ── -->
  <section id="briefSection" class="brief-section" aria-label="Today's Brief"></section>

  <!-- ── Filter bar (sticky) ── -->
  <nav class="filter-bar" aria-label="Filters">
    <div class="chips" id="chips"></div>
  </nav>

  <!-- ── Meta line (story count + last updated) ── -->
  <div id="metaLine" class="feed-meta"></div>

  <!-- ── Article feed ── -->
  <main class="feed" id="list">
    <div class="empty" id="initialEmpty"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="/static/i18n.js"></script>
<script>
  // ─── Static maps ────────────────────────────────────────────────────
  const IMP = {
    must_read:     ["🔥", "importanceMustRead",     "must-read"],
    worth_knowing: ["📌", "importanceWorthKnowing", "worth-knowing"],
    if_time:       ["💡", "importanceIfTime",       "if-time"],
  };
  const IMP_RANK = { must_read: 0, worth_knowing: 1, if_time: 2 };

  const SOURCE_BIAS = {
    "BBC": "Lean Left", "NPR": "Lean Left", "Guardian": "Left",
    "Nikkei Asia": "Center", "SCMP": "Center",
  };
  const BIAS_I18N = {
    "Left": "biasLeft", "Lean Left": "biasLeanLeft", "Center": "biasCenter",
    "Lean Right": "biasLeanRight", "Right": "biasRight",
  };

  const CHIPS = [
    { filter: "all",               emoji: "",   key: "filterAll" },
    { filter: "topic:Geopolitics", emoji: "🌍", key: "topicGeopolitics" },
    { filter: "topic:Business",    emoji: "💰", key: "topicBusiness" },
    { filter: "topic:Tech",        emoji: "💻", key: "topicTech" },
    { filter: "topic:China",       emoji: "🇨🇳", key: "topicChina" },
    { filter: "topic:Japan",       emoji: "🇯🇵", key: "topicJapan" },
    { filter: "topic:Science",     emoji: "🔬", key: "topicScience" },
    { filter: "topic:Other",       emoji: "📰", key: "topicOther" },
  ];

  const PAGE_SIZE = 15;
  const state = {
    articles: [], filter: "all", visible: PAGE_SIZE,
    refreshing: false, pollTimer: null, lastRefreshed: null,
    brief: null,        // null = loading, [] = empty, [{…}…] = items
    briefFailed: false, // true if /api/brief fetch threw
    articlesLoaded: false, // false until first /api/news returns (skeleton gate)
  };

  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  const TRANSLATED_KEY = "translated_articles";
  function getTranslatedStates() {
    try { return JSON.parse(localStorage.getItem(TRANSLATED_KEY) || "{}"); }
    catch { return {}; }
  }
  function setTranslatedStates(s) {
    try { localStorage.setItem(TRANSLATED_KEY, JSON.stringify(s)); }
    catch { /* quota */ }
  }

  function toast(msg) {
    const el = $("#toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(el._timer);
    el._timer = setTimeout(() => el.classList.remove("show"), 3000);
  }

  function relativeTime(iso) {
    if (!iso) return "";
    const ms = new Date(iso).getTime();
    if (isNaN(ms)) return "";
    const diff = Date.now() - ms;
    if (diff < 60000) return t("justNow");
    const min = Math.floor(diff / 60000);
    if (min < 60) return t("timeAgo", min, "m");
    const hr = Math.floor(min / 60);
    if (hr < 24) return t("timeAgo", hr, "h");
    const day = Math.floor(hr / 24);
    if (day < 7) return t("timeAgo", day, "d");
    return new Date(iso).toLocaleDateString();
  }

  function filteredAndSorted() {
    const f = state.filter;
    let arr = state.articles;
    if (f.startsWith("imp:"))        arr = arr.filter(a => a.importance === f.slice(4));
    else if (f.startsWith("topic:")) arr = arr.filter(a => a.topic === f.slice(6));
    return [...arr].sort((a, b) => {
      const ra = IMP_RANK[a.importance] ?? 3, rb = IMP_RANK[b.importance] ?? 3;
      if (ra !== rb) return ra - rb;
      const ta = a.published_at ? new Date(a.published_at).getTime() : 0;
      const tb = b.published_at ? new Date(b.published_at).getTime() : 0;
      return tb - ta;
    });
  }

  // ─── Today's Brief ──────────────────────────────────────────────────
  function _briefHeader() {
    return `
      <div class="brief-header">
        <span class="brief-title-label">${esc(t("briefTitle"))}</span>
        <span class="brief-date-label">${esc(t("briefDate"))}</span>
      </div>`;
  }

  function _briefSkeletons() {
    const item = `
      <div class="brief-skel-item">
        <div class="brief-skel-emoji"></div>
        <div class="brief-skel-body">
          <div class="brief-skel-line brief-skel-lbl"></div>
          <div class="brief-skel-line brief-skel-txt1"></div>
          <div class="brief-skel-line brief-skel-txt2"></div>
        </div>
      </div>`;
    return item + item + item;
  }

  function _briefItems(items) {
    return items.map(item => {
      // Only render as a link when the URL is real-looking (http(s)). The
      // backend already validates against the article URL set; this is
      // defense-in-depth against malformed/empty source_url.
      const url = String(item.source_url || "").trim();
      const isLink = /^https?:\/\//i.test(url);
      const content = `
        <span class="brief-emoji" aria-hidden="true">${esc(item.emoji)}</span>
        <div class="brief-content">
          <div class="brief-label">${esc(item.label)}</div>
          <div class="brief-framing">${esc(item.framing)}</div>
        </div>`;
      return isLink
        ? `<a class="brief-item" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${content}</a>`
        : `<div class="brief-item brief-item--nolink">${content}</div>`;
    }).join("");
  }

  function renderBriefSection() {
    const section = $("#briefSection");
    if (!section) return;

    if (state.briefFailed) {
      section.style.display = "none";
      return;
    }
    section.style.display = "";

    if (state.brief === null) {
      // Loading — show skeletons
      section.innerHTML = _briefHeader() + _briefSkeletons();
      return;
    }
    if (state.brief.length === 0) {
      // Empty — no data yet
      section.innerHTML = _briefHeader() +
        `<div class="brief-empty">${esc(t("briefEmpty"))}</div>`;
      return;
    }
    section.innerHTML = _briefHeader() + _briefItems(state.brief);
  }

  async function loadBrief() {
    state.brief = null;
    state.briefFailed = false;
    renderBriefSection();
    try {
      const r = await fetch("/api/brief");
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const data = await r.json();
      state.brief = data.items || [];
      renderBriefSection();
    } catch (e) {
      state.briefFailed = true;
      renderBriefSection();
    }
  }

  // ─── Card renderer ──────────────────────────────────────────────────
  function renderCard(a) {
    const [iE, iLabelKey, iC] = IMP[a.importance] || ["", "", ""];
    const bias = SOURCE_BIAS[a.source];
    const biasLabel = bias ? t(BIAS_I18N[bias] || "biasCenter") : "";
    const rel = relativeTime(a.published_at);
    const timeHtml = rel ? `<span class="time-ago">${esc(rel)}</span>` : "";
    const biasPart = bias
      ? ` · ${esc(biasLabel)}<button class="bias-info" type="button" aria-label="About bias rating" data-tooltip="${esc(t("biasTooltip"))}"><span>i</span></button>`
      : "";

    const states = getTranslatedStates();
    const cached = states[a.url];
    const displayTitle   = cached ? cached.title   : (a.title || "");
    const displaySummary = cached ? cached.summary : (a.summary_en || "");
    const translateLabel = cached ? t("showOriginal") : t("translate");

    const showImportance = a.importance === "must_read" || a.importance === "worth_knowing";
    const importanceHtml = showImportance
      ? `<span class="importance ${iC}">${iE} ${esc(t(iLabelKey))}</span>`
      : `<span class="importance-spacer"></span>`;

    const thumbHtml = a.og_image
      ? `<img class="thumb" src="${esc(a.og_image)}" loading="lazy" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`
      : "";

    // Talking points: render only when present + non-empty. Older articles
    // analyzed before this feature was added will have an empty array and
    // skip the section entirely.
    //
    // Bake both labels into data-* attributes at render time so the toggle
    // never needs to re-call t() on click — that was rendering the raw key
    // "hideTalkingPoints" in some environments.
    const tpArr = Array.isArray(a.talking_points) ? a.talking_points : [];
    // "💬 Talking points · 2" — count hint signals there's more than 1 line
    // hiding below, so users don't have to expand to find out.
    const tpShow = tpArr.length > 0
      ? `${t("talkingPoints")} · ${tpArr.length}`
      : t("talkingPoints");
    const tpHide = t("hideTalkingPoints");
    const tpHtml = tpArr.length > 0
      ? `<div class="talking-points-wrap">
           <button class="talking-points-toggle" type="button" aria-expanded="false"
                   data-label-show="${esc(tpShow)}" data-label-hide="${esc(tpHide)}">
             <span class="tp-label">${esc(tpShow)}</span>
           </button>
           <div class="talking-points-collapse">
             <div class="talking-points">
               ${tpArr.map(p => `<div class="talking-point">${esc(p)}</div>`).join("")}
             </div>
           </div>
         </div>`
      : "";

    return `
      <article data-url="${esc(a.url)}">
        <div class="card-body">
          <div class="card-top">
            <span class="src-line">${esc(a.source)}${biasPart}</span>
            ${timeHtml}
          </div>
          <a href="${esc(a.url)}" target="_blank" rel="noopener">
            <div class="title">${esc(displayTitle)}</div>
          </a>
          <div class="summary-en">${esc(displaySummary)}</div>
          <div class="card-bottom">
            ${importanceHtml}
            <span class="translate-wrap">
              <button class="translate-btn ${cached ? "show-original" : ""}" type="button">${esc(translateLabel)}</button>
            </span>
          </div>
          ${tpHtml}
        </div>
        ${thumbHtml}
      </article>`;
  }

  function _articleSkeleton() {
    // Single skeleton card. We repeat 4× on first load so users see motion
    // immediately instead of an empty screen while /api/news is in flight.
    return `
      <article class="card-skel" aria-hidden="true">
        <div class="card-body">
          <div class="card-skel-top">
            <div class="card-skel-bar card-skel-src"></div>
            <div class="card-skel-bar card-skel-time"></div>
          </div>
          <div class="card-skel-bar card-skel-title"></div>
          <div class="card-skel-bar card-skel-title card-skel-title2"></div>
          <div class="card-skel-bar card-skel-sum"></div>
          <div class="card-skel-bar card-skel-sum card-skel-sum2"></div>
        </div>
        <div class="card-skel-thumb"></div>
      </article>`;
  }

  function render() {
    const list = $("#list");
    // First load: no articles yet AND we haven't heard back from /api/news.
    // Show skeleton cards so the layout doesn't sit blank.
    if (!state.articlesLoaded && state.articles.length === 0) {
      list.innerHTML = _articleSkeleton().repeat(4);
      return;
    }
    const filtered = filteredAndSorted();
    if (!filtered.length) {
      const msg = state.articles.length ? t("emptyFiltered") : t("emptyNoData");
      list.innerHTML = `<div class="empty">${esc(msg)}</div>`;
      return;
    }
    const shown = filtered.slice(0, state.visible);
    const remaining = filtered.length - shown.length;
    const more = remaining > 0
      ? `<div class="load-more-wrap"><button class="load-more" id="loadMore">${esc(t("loadMore", remaining))}</button></div>`
      : "";
    list.innerHTML = shown.map(renderCard).join("") + more;

    list.querySelectorAll(".translate-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const card = btn.closest("article");
        const url = card.dataset.url;
        btn.classList.contains("show-original") ? revertTranslation(url) : onTranslateClick(btn, url);
      });
    });

    // Talking points expand/collapse — labels are pre-baked into the
    // button's data-* attributes at render time, so we never call t() here.
    list.querySelectorAll(".talking-points-toggle").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const wrap = btn.closest(".talking-points-wrap");
        const collapse = wrap.querySelector(".talking-points-collapse");
        const label = btn.querySelector(".tp-label");
        const expanded = collapse.classList.toggle("expanded");
        btn.setAttribute("aria-expanded", String(expanded));
        label.textContent = expanded
          ? (btn.dataset.labelHide || label.textContent)
          : (btn.dataset.labelShow || label.textContent);
      });
    });

    const lm = document.getElementById("loadMore");
    if (lm) lm.addEventListener("click", loadMore);
  }

  function loadMore() { state.visible += PAGE_SIZE; render(); }

  // ─── Filter chips ───────────────────────────────────────────────────
  function renderChips() {
    $("#chips").innerHTML = CHIPS.map(c => {
      const label = (c.emoji ? c.emoji + " " : "") + t(c.key);
      const active = c.filter === state.filter ? " active" : "";
      return `<button class="chip${active}" data-filter="${esc(c.filter)}">${esc(label)}</button>`;
    }).join("");
    document.querySelectorAll(".chip").forEach(c => {
      c.addEventListener("click", () => setFilter(c.dataset.filter));
    });
  }

  function setFilter(f) {
    state.filter = f; state.visible = PAGE_SIZE;
    renderChips(); render();
  }

  // ─── Meta line ──────────────────────────────────────────────────────
  function setMetaLine({ count, lastRefreshed }) {
    const el = $("#metaLine");
    if (!el) return;
    if (!lastRefreshed) { el.textContent = t("headerNever"); return; }
    const rel = relativeTime(lastRefreshed) || t("justNow");
    el.textContent = t("headerStats", count, rel);
  }

  // ─── Data fetch ─────────────────────────────────────────────────────
  async function loadNews() {
    try {
      const r = await fetch("/api/news");
      const data = await r.json();
      state.articles = data.articles || [];
      state.lastRefreshed = data.last_refreshed || null;
      setMetaLine({ count: state.articles.length, lastRefreshed: state.lastRefreshed });
    } catch (e) {
      toast(t("toastLoadFailed", e.message));
    } finally {
      // Always flip the gate, even on error — otherwise skeletons would
      // sit there forever and hide the empty/error state.
      state.articlesLoaded = true;
      render();
    }
  }

  // ─── Refresh button + polling ────────────────────────────────────────
  function setRefreshButton(busy) {
    const btn = $("#refresh");
    const label = btn.querySelector(".rr-label");
    btn.disabled = busy;
    btn.classList.toggle("spinning", busy);
    const txt = busy ? t("refreshing") : t("refresh");
    label.textContent = txt;
    btn.setAttribute("aria-label", txt);
  }

  function stopPolling() {
    if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
  }

  async function pollStatus() {
    try {
      const r = await fetch("/api/refresh/status");
      if (!r.ok) return;
      const s = await r.json();
      if (s.status === "running") return;
      stopPolling();
      state.refreshing = false;
      setRefreshButton(false);
      if (s.status === "done") {
        // Load news + brief together — brief is ready server-side when status is "done"
        await Promise.all([loadNews(), loadBrief()]);
        const stats = s.stats || {};
        const failed = s.sources_failed || [];
        let msg;
        if (failed.length)                       msg = t("toastPartialFail", failed.join(", "));
        else if (typeof stats.new === "number")  msg = stats.new > 0 ? t("toastAddedNew", stats.new) : t("toastNoNew");
        else                                     msg = t("toastRefreshed");
        toast(msg);
      } else if (s.status === "error") {
        toast(t("toastRefreshFailed", s.error || "unknown error"));
      }
    } catch (e) { /* transient — retry next tick */ }
  }

  async function doRefresh() {
    if (state.refreshing) return;
    // Quick brand spin — visual feedback that the pull is happening.
    // Diagnostic logs so we can see in DevTools whether the trigger fires.
    const loopEl = document.querySelector(".brand-loop");
    console.log("[loop-spin] element found:", loopEl);
    if (loopEl) {
      console.log("[loop-spin] classes before:", loopEl.className);
      loopEl.classList.remove("logo-spinning"); // allow retrigger
      void loopEl.offsetWidth;                  // reflow so the animation restarts
      loopEl.classList.add("logo-spinning");
      console.log("[loop-spin] classes after:", loopEl.className);
      // Belt-and-suspenders: also drive the animation via Web Animations API
      // in case the class-based animation gets nuked by browser cache or a
      // CSS specificity surprise. WAAPI runs regardless of stylesheet state.
      if (typeof loopEl.animate === "function") {
        loopEl.animate(
          [{ transform: "rotate(0deg)" }, { transform: "rotate(360deg)" }],
          { duration: 700, easing: "cubic-bezier(0.4, 0, 0.2, 1)" }
        );
        console.log("[loop-spin] WAAPI animation queued");
      }
      setTimeout(() => {
        loopEl.classList.remove("logo-spinning");
        console.log("[loop-spin] cleanup done");
      }, 700);
    } else {
      console.warn("[loop-spin] .brand-loop NOT FOUND in DOM");
    }
    setRefreshButton(true);
    try {
      const r = await fetch("/api/refresh", { method: "POST" });
      if (r.status === 429) {
        const err = await r.json().catch(() => ({}));
        toast((err.detail && err.detail.error) || t("toastRateLimited"));
        setRefreshButton(false);
        return;
      }
      if (r.status === 409) {
        state.refreshing = true;
        state.pollTimer = setInterval(pollStatus, 3000);
        return;
      }
      if (!r.ok) {
        const err = await r.json().catch(() => ({ detail: r.statusText }));
        throw new Error(err.detail || `HTTP ${r.status}`);
      }
      state.refreshing = true;
      state.pollTimer = setInterval(pollStatus, 3000);
    } catch (e) {
      toast(t("toastRefreshFailed", e.message));
      setRefreshButton(false);
    }
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stopPolling();
    else if (state.refreshing && !state.pollTimer) {
      pollStatus();
      state.pollTimer = setInterval(pollStatus, 3000);
    }
  });

  // ─── Translation flow ────────────────────────────────────────────────
  function onTranslateClick(btn, url) {
    const lang = window.getUiLang();
    if (lang === "zh" || lang === "ja") { translateArticle(url, lang); return; }
    document.querySelectorAll(".translate-menu").forEach(el => el.remove());
    const menu = document.createElement("div");
    menu.className = "translate-menu";
    menu.innerHTML = `
      <button type="button" data-lang="zh">${esc(t("pickChinese"))}</button>
      <button type="button" data-lang="ja">${esc(t("pickJapanese"))}</button>`;
    btn.closest(".translate-wrap").appendChild(menu);
    menu.querySelectorAll("button").forEach(b => {
      b.addEventListener("click", (e) => {
        e.stopPropagation(); menu.remove(); translateArticle(url, b.dataset.lang);
      });
    });
    setTimeout(() => {
      document.addEventListener("click", function close(ev) {
        if (!menu.contains(ev.target)) { menu.remove(); document.removeEventListener("click", close); }
      });
    }, 0);
  }

  async function translateArticle(url, lang) {
    const card = document.querySelector(`article[data-url="${CSS.escape(url)}"]`);
    if (!card) return;
    const btn = card.querySelector(".translate-btn");
    const titleEl = card.querySelector(".title");
    const summaryEl = card.querySelector(".summary-en");
    const origTitle = titleEl.textContent, origSummary = summaryEl.textContent;
    btn.disabled = true; btn.textContent = t("translating");
    try {
      const r = await fetch("/api/translate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ article_id: url, target_lang: lang }),
      });
      if (r.status === 429) {
        const err = await r.json().catch(() => ({}));
        toast((err.detail && err.detail.error) || t("toastRateLimited"));
        return;
      }
      if (!r.ok) {
        const err = await r.json().catch(() => ({ detail: r.statusText }));
        throw new Error(err.detail || `HTTP ${r.status}`);
      }
      const data = await r.json();
      titleEl.textContent = data.title_translated;
      summaryEl.textContent = data.summary_translated;
      const states = getTranslatedStates();
      states[url] = { lang, title: data.title_translated, summary: data.summary_translated,
                      orig_title: origTitle, orig_summary: origSummary };
      setTranslatedStates(states);
      btn.classList.add("show-original"); btn.textContent = t("showOriginal");
    } catch (e) {
      toast(t("toastTranslateFailed", e.message)); btn.textContent = t("translate");
    } finally { btn.disabled = false; }
  }

  function revertTranslation(url) {
    const states = getTranslatedStates();
    const cached = states[url];
    if (!cached) return;
    const card = document.querySelector(`article[data-url="${CSS.escape(url)}"]`);
    if (card) {
      card.querySelector(".title").textContent = cached.orig_title;
      card.querySelector(".summary-en").textContent = cached.orig_summary;
      const btn = card.querySelector(".translate-btn");
      btn.classList.remove("show-original"); btn.textContent = t("translate");
    }
    delete states[url]; setTranslatedStates(states);
  }

  // ─── i18n apply ──────────────────────────────────────────────────────
  function applyI18n() {
    document.title = t("pageTitle");

    // Hero text — was hardcoded in HTML, now driven by i18n so the headline
    // and subhead actually swap when you click EN/中/日.
    const headline = $("#heroHeadline");
    if (headline) headline.textContent = t("heroHeadline");
    const sub = $("#heroSub");
    if (sub) sub.textContent = t("heroSub");

    // Refresh button label + aria-label
    const refreshBtn = $("#refresh");
    const refreshLabel = state.refreshing ? t("refreshing") : t("refresh");
    refreshBtn.querySelector(".rr-label").textContent = refreshLabel;
    refreshBtn.setAttribute("aria-label", refreshLabel);

    // Lang switcher group aria-label
    const switcher = $("#langSwitcher");
    if (switcher) switcher.setAttribute("aria-label", t("langSwitcherAria"));

    document.querySelectorAll("#langSwitcher button").forEach(b => {
      b.classList.toggle("active", b.dataset.lang === window.getUiLang());
    });
    renderBriefSection();  // re-render header label + date in new language
    renderChips();
    setMetaLine({ count: state.articles.length, lastRefreshed: state.lastRefreshed });
    render();
  }

  function changeLang(lang) { window.setUiLang(lang); applyI18n(); }

  // ─── Language nudge ──────────────────────────────────────────────────
  (function initLangNudge() {
    // Only show if: (a) nudge hasn't been dismissed before, AND
    //              (b) the user hasn't already picked a non-English UI lang
    const nudgeEl = $("#langNudge");
    if (!nudgeEl) return;
    const alreadySeen  = localStorage.getItem("lang_nudge_shown");
    const currentLang  = window.getUiLang();
    if (alreadySeen || currentLang !== "en") return;

    let dismissTimer = null;

    function dismissNudge() {
      clearTimeout(dismissTimer);
      nudgeEl.classList.add("lang-nudge--hidden");
      localStorage.setItem("lang_nudge_shown", "1");
    }

    // Show (small rAF delay so CSS transition plays on first paint)
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        nudgeEl.classList.remove("lang-nudge--hidden");
        dismissTimer = setTimeout(dismissNudge, 8000);
      });
    });

    // Lang buttons: switch language + dismiss
    nudgeEl.querySelectorAll(".lang-nudge-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        changeLang(btn.dataset.lang);
        dismissNudge();
      });
    });

    // × button: dismiss only
    nudgeEl.querySelector(".lang-nudge-close").addEventListener("click", dismissNudge);
  })();

  // ─── Boot ────────────────────────────────────────────────────────────
  $("#refresh").addEventListener("click", doRefresh);
  document.querySelectorAll("#langSwitcher button").forEach(b => {
    b.addEventListener("click", () => changeLang(b.dataset.lang));
  });
  applyI18n();   // sets up language, chips, empty feed state
  loadNews();    // fetch articles
  loadBrief();   // fetch brief (shows skeletons while loading)
</script>
</body>
</html>
