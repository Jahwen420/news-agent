<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today's Headlines</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --soft: #8e8e93;
    --border: rgba(0, 0, 0, 0.06);
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.04);
    --shadow-hover: 0 2px 4px rgba(0,0,0,0.06), 0 12px 32px rgba(0,0,0,0.08);
    --chip-bg: transparent;
    --chip-border: rgba(0, 0, 0, 0.12);
    --chip-active: #1d1d1f;
    --chip-active-text: #ffffff;
    --must-color: #d32f2f;
    --worth-color: #b27d00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f10;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --muted: #98989d;
      --soft: #6e6e73;
      --border: rgba(255,255,255,0.08);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.25);
      --shadow-hover: 0 2px 4px rgba(0,0,0,0.35), 0 12px 32px rgba(0,0,0,0.4);
      --chip-border: rgba(255, 255, 255, 0.18);
      --chip-active: #f5f5f7;
      --chip-active-text: #1d1d1f;
      --must-color: #ff7a7a;
      --worth-color: #e0b84a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI",
                 Roboto, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px 80px; }
  @media (min-width: 768px) { .wrap { padding: 32px 24px 96px; } }

  header { padding: 8px 0 12px; }
  .title-row {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px;
  }
  header h1 {
    font-size: 24px; font-weight: 700;
    letter-spacing: -0.02em; margin: 0;
  }
  @media (min-width: 768px) { header h1 { font-size: 32px; } }
  header .meta {
    font-size: 13px; color: var(--muted);
    margin-top: 6px;
    letter-spacing: -0.005em;
  }
  /* 头部右侧:语言切换 + 刷新,横排,移动端不挤压 */
  .actions { display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .lang-switcher {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
    background: var(--card);
    box-shadow: var(--shadow);
  }
  .lang-switcher button {
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: inherit;
    font-size: 12px; font-weight: 600;
    padding: 6px 10px;
    cursor: pointer;
    line-height: 1;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .lang-switcher button:hover { color: var(--text); }
  .lang-switcher button.active {
    background: var(--chip-active);
    color: var(--chip-active-text);
  }
  @media (max-width: 400px) {
    .lang-switcher button { padding: 6px 8px; font-size: 11px; }
  }

  /* 带文字的描边按钮:移动端也保留 "Refresh" label,不退化为图标 */
  #refresh {
    display: inline-flex; align-items: center;
    gap: 6px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 14px; font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow);
    flex-shrink: 0;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }
  #refresh:hover  { transform: translateY(-1px); box-shadow: var(--shadow-hover); border-color: var(--text); }
  #refresh:active { transform: scale(0.98); }
  #refresh:disabled { opacity: 0.6; cursor: wait; transform: none; box-shadow: var(--shadow); }
  #refresh .rr-icon { display: inline-block; font-size: 14px; line-height: 1; }
  /* spinning 只转 icon,文字保持静止 */
  #refresh.spinning .rr-icon { animation: spin 1s linear infinite; }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

  /* sticky 横向滚动筛选条 */
  .filter-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    margin: 8px -16px 16px;
    padding: 8px 0;
  }
  @media (min-width: 768px) { .filter-bar { margin: 12px 0 20px; padding: 0; } }
  .chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px 16px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  @media (min-width: 768px) {
    .chips { flex-wrap: wrap; overflow-x: visible; padding: 0; }
  }
  .chip {
    flex-shrink: 0;
    padding: 7px 14px;
    border-radius: 999px;
    background: var(--chip-bg);
    border: 1px solid var(--chip-border);
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .chip:hover { border-color: var(--text); }
  .chip.active {
    background: var(--chip-active);
    color: var(--chip-active-text);
    border-color: var(--chip-active);
  }

  /* 文章卡片 */
  .feed { display: flex; flex-direction: column; gap: 10px; }
  article {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  @media (min-width: 768px) { article { padding: 18px 20px; } }
  article:active { transform: scale(0.99); }
  @media (hover: hover) {
    article:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
  }
  /* 卡片整体改成水平 flex,缩略图在右,有图无图都用同一套布局 */
  article {
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .card-body { flex: 1; min-width: 0; }
  article a { color: inherit; text-decoration: none; display: block; }
  article a:hover .title { text-decoration: underline; text-decoration-thickness: 1px; }

  /* 顶部一行:左=来源·立场+i,右=时间 */
  .card-top {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
  }
  .src-line {
    font-weight: 500;
    display: inline-flex; align-items: center; gap: 2px;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .time-ago { font-weight: 500; color: var(--soft); flex-shrink: 0; }

  .title {
    font-size: 16px; font-weight: 600;
    margin-top: 6px; letter-spacing: -0.01em;
    line-height: 1.4;
  }
  @media (min-width: 768px) { .title { font-size: 18px; } }
  .summary-en {
    font-size: 14px; color: var(--muted);
    margin-top: 8px; line-height: 1.5;
  }

  /* 底部行:始终渲染(放 Translate 按钮);importance 只对 must_read / worth_knowing 显示 */
  .card-bottom {
    margin-top: 10px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  .importance { font-size: 12px; font-weight: 600; }
  .importance.must-read     { color: var(--must-color); }
  .importance.worth-knowing { color: var(--worth-color); }
  .importance-spacer { flex: 1; }  /* 没 importance 时占位,让 Translate 留在右侧 */

  /* Translate / Show original:克制的文本按钮,不抢标题视线 */
  .translate-wrap { position: relative; }
  .translate-btn {
    background: transparent; border: none;
    color: var(--muted);
    font-family: inherit;
    font-size: 12px; font-weight: 500;
    cursor: pointer; padding: 2px 0;
    transition: color 0.15s ease;
  }
  .translate-btn:hover { color: var(--text); text-decoration: underline; }
  .translate-btn:disabled { opacity: 0.55; cursor: wait; text-decoration: none; }

  /* EN UI 下点 Translate 弹出的小菜单(中文 / 日本語) */
  .translate-menu {
    position: absolute;
    bottom: calc(100% + 6px);
    right: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow-hover);
    padding: 4px;
    z-index: 50;
    display: flex; flex-direction: column;
    gap: 2px;
    min-width: 110px;
  }
  .translate-menu button {
    background: transparent; border: none;
    text-align: left;
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
    border-radius: 6px;
    font-family: inherit;
    color: var(--text);
    white-space: nowrap;
  }
  .translate-menu button:hover { background: var(--bg); }

  /* 缩略图:右侧固定方块,object-fit:cover 裁剪 */
  .thumb {
    width: 80px; height: 80px;
    border-radius: 10px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--border);
  }
  @media (min-width: 768px) {
    .thumb { width: 120px; height: 120px; }
  }

  /* Load more:primary action,mobile 满宽,desktop 居中 240px */
  .load-more-wrap { margin-top: 28px; display: flex; justify-content: center; }
  .load-more {
    display: block;
    width: 100%;
    background: var(--chip-active);
    color: var(--chip-active-text);
    border: none;
    padding: 14px 24px;
    border-radius: 12px;
    font-size: 15px; font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.01em;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }
  .load-more:hover  { transform: translateY(-1px); box-shadow: var(--shadow-hover); opacity: 0.92; }
  .load-more:active { transform: scale(0.99); }
  @media (min-width: 768px) {
    .load-more { width: auto; min-width: 240px; }
  }

  /* "i" 信息按钮:小、轻、与周围文字同色,只在 hover/focus 时出 tooltip */
  .bias-info {
    all: unset;
    display: inline-flex; align-items: center; justify-content: center;
    width: 11px; height: 11px;
    margin-left: 3px;
    border-radius: 999px;
    border: 1px solid currentColor;
    color: var(--soft);
    font-size: 8px; font-weight: 700;
    cursor: help;
    position: relative;
    line-height: 1;
    opacity: 0.7;
  }
  .bias-info:hover, .bias-info:focus { opacity: 1; }
  .bias-info > span { font-style: italic; }
  .bias-info::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg);
    padding: 7px 10px; border-radius: 8px;
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.2px; text-transform: none;
    white-space: nowrap; max-width: 80vw;
    opacity: 0; pointer-events: none;
    transition: opacity 0.15s ease;
    z-index: 100;
    box-shadow: var(--shadow);
  }
  .bias-info:hover::after,
  .bias-info:focus::after,
  .bias-info:focus-visible::after { opacity: 1; }

  .empty {
    text-align: center; padding: 60px 16px;
    color: var(--muted); font-size: 15px;
  }

  .toast {
    position: fixed;
    bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg);
    padding: 10px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 500;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    max-width: calc(100vw - 32px);
    box-shadow: var(--shadow-hover);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-row">
      <h1 id="pageTitle">Today's Headlines</h1>
      <div class="actions">
        <div class="lang-switcher" id="langSwitcher" role="group" aria-label="Language">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="zh">中</button>
          <button type="button" data-lang="ja">日</button>
        </div>
        <button id="refresh" type="button" aria-label="Refresh news">
          <span class="rr-icon" aria-hidden="true">🔄</span>
          <span class="rr-label">Refresh</span>
        </button>
      </div>
    </div>
    <div class="meta" id="metaLine"></div>
  </header>

  <nav class="filter-bar" aria-label="Filters">
    <div class="chips" id="chips"></div>
  </nav>

  <main class="feed" id="list">
    <div class="empty" id="initialEmpty"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="/static/i18n.js"></script>
<script>
  // ─── 表 + 静态映射 ──────────────────────────────────────────────────────
  // emoji + class 留在 JS,文字 label 走 i18n
  const IMP = {
    must_read:     ["🔥", "importanceMustRead",     "must-read"],
    worth_knowing: ["📌", "importanceWorthKnowing", "worth-knowing"],
    if_time:       ["💡", "importanceIfTime",       "if-time"],
  };
  const IMP_RANK = { must_read: 0, worth_knowing: 1, if_time: 2 };

  // AllSides 评级 → 英文字符串。展示时通过 BIAS_I18N 拿到 t() key
  const SOURCE_BIAS = {
    "BBC": "Lean Left", "NPR": "Lean Left", "Guardian": "Left",
    "Nikkei Asia": "Center", "SCMP": "Center",
  };
  const BIAS_I18N = {
    "Left":       "biasLeft",
    "Lean Left":  "biasLeanLeft",
    "Center":     "biasCenter",
    "Lean Right": "biasLeanRight",
    "Right":      "biasRight",
  };

  // 筛选条配置:emoji 在 JS,文字 label 走 i18n key
  const CHIPS = [
    { filter: "all",                emoji: "",   key: "filterAll" },
    { filter: "topic:Geopolitics",  emoji: "🌍", key: "topicGeopolitics" },
    { filter: "topic:Business",     emoji: "💰", key: "topicBusiness" },
    { filter: "topic:Tech",         emoji: "💻", key: "topicTech" },
    { filter: "topic:China",        emoji: "🇨🇳", key: "topicChina" },
    { filter: "topic:Japan",        emoji: "🇯🇵", key: "topicJapan" },
    { filter: "topic:Science",      emoji: "🔬", key: "topicScience" },
    { filter: "topic:Other",        emoji: "📰", key: "topicOther" },
  ];

  const PAGE_SIZE = 15;
  const state = {
    articles: [], filter: "all", visible: PAGE_SIZE,
    refreshing: false, pollTimer: null, lastRefreshed: null,
  };

  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
    (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // localStorage 里的"翻译态":{url: {lang, title, summary, orig_title, orig_summary}}
  const TRANSLATED_KEY = "translated_articles";
  function getTranslatedStates() {
    try { return JSON.parse(localStorage.getItem(TRANSLATED_KEY) || "{}"); }
    catch { return {}; }
  }
  function setTranslatedStates(s) {
    try { localStorage.setItem(TRANSLATED_KEY, JSON.stringify(s)); }
    catch { /* quota — 忽略 */ }
  }

  function toast(msg) {
    const el = $("#toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(el._timer);
    el._timer = setTimeout(() => el.classList.remove("show"), 3000);
  }

  // ─── 相对时间:通过 t('timeAgo', n, unit) 走当前语言 ─────────────────────
  function relativeTime(iso) {
    if (!iso) return "";
    const ms = new Date(iso).getTime();
    if (isNaN(ms)) return "";
    const diff = Date.now() - ms;
    if (diff < 60000) return t("justNow");
    const min = Math.floor(diff / 60000);
    if (min < 60) return t("timeAgo", min, "m");
    const hr = Math.floor(min / 60);
    if (hr < 24)  return t("timeAgo", hr, "h");
    const day = Math.floor(hr / 24);
    if (day < 7)  return t("timeAgo", day, "d");
    return new Date(iso).toLocaleDateString();
  }

  function filteredAndSorted() {
    const f = state.filter;
    let arr = state.articles;
    if (f.startsWith("imp:"))        arr = arr.filter(a => a.importance === f.slice(4));
    else if (f.startsWith("topic:")) arr = arr.filter(a => a.topic === f.slice(6));
    return [...arr].sort((a, b) => {
      const ra = IMP_RANK[a.importance] ?? 3;
      const rb = IMP_RANK[b.importance] ?? 3;
      if (ra !== rb) return ra - rb;
      const ta = a.published_at ? new Date(a.published_at).getTime() : 0;
      const tb = b.published_at ? new Date(b.published_at).getTime() : 0;
      return tb - ta;
    });
  }

  // ─── 卡片渲染 ───────────────────────────────────────────────────────────
  function renderCard(a) {
    const [iE, iLabelKey, iC] = IMP[a.importance] || ["", "", ""];
    const bias = SOURCE_BIAS[a.source];
    const biasLabel = bias ? t(BIAS_I18N[bias] || "biasCenter") : "";
    const rel = relativeTime(a.published_at);
    const timeHtml = rel ? `<span class="time-ago">${esc(rel)}</span>` : "";
    const biasPart = bias
      ? ` · ${esc(biasLabel)}<button class="bias-info" type="button" aria-label="About bias rating" data-tooltip="${esc(t("biasTooltip"))}"><span>i</span></button>`
      : "";

    // 翻译态:有就用 cached 内容,没就用原文
    const states = getTranslatedStates();
    const cached = states[a.url];
    const displayTitle   = cached ? cached.title   : (a.title || "");
    const displaySummary = cached ? cached.summary : (a.summary_en || "");
    const translateLabel = cached ? t("showOriginal") : t("translate");

    const showImportance = a.importance === "must_read" || a.importance === "worth_knowing";
    const importanceHtml = showImportance
      ? `<span class="importance ${iC}">${iE} ${esc(t(iLabelKey))}</span>`
      : `<span class="importance-spacer"></span>`;

    const thumbHtml = a.og_image
      ? `<img class="thumb" src="${esc(a.og_image)}" loading="lazy" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`
      : "";

    return `
      <article data-url="${esc(a.url)}">
        <div class="card-body">
          <div class="card-top">
            <span class="src-line">${esc(a.source)}${biasPart}</span>
            ${timeHtml}
          </div>
          <a href="${esc(a.url)}" target="_blank" rel="noopener">
            <div class="title">${esc(displayTitle)}</div>
          </a>
          <div class="summary-en">${esc(displaySummary)}</div>
          <div class="card-bottom">
            ${importanceHtml}
            <span class="translate-wrap">
              <button class="translate-btn ${cached ? "show-original" : ""}" type="button">${esc(translateLabel)}</button>
            </span>
          </div>
        </div>
        ${thumbHtml}
      </article>`;
  }

  function render() {
    const filtered = filteredAndSorted();
    const list = $("#list");
    if (!filtered.length) {
      const msg = state.articles.length ? t("emptyFiltered") : t("emptyNoData");
      list.innerHTML = `<div class="empty">${esc(msg)}</div>`;
      return;
    }
    const shown = filtered.slice(0, state.visible);
    const remaining = filtered.length - shown.length;
    const more = remaining > 0
      ? `<div class="load-more-wrap"><button class="load-more" id="loadMore">${esc(t("loadMore", remaining))}</button></div>`
      : "";
    list.innerHTML = shown.map(renderCard).join("") + more;

    // 事件:Translate / Show original 用事件委托更稳,直接绑也行
    list.querySelectorAll(".translate-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const card = btn.closest("article");
        const url = card.dataset.url;
        if (btn.classList.contains("show-original")) {
          revertTranslation(url);
        } else {
          onTranslateClick(btn, url);
        }
      });
    });

    const lm = document.getElementById("loadMore");
    if (lm) lm.addEventListener("click", loadMore);
  }

  function loadMore() {
    state.visible += PAGE_SIZE;
    render();
  }

  // ─── 筛选条:渲染 + 事件 ────────────────────────────────────────────────
  function renderChips() {
    const html = CHIPS.map(c => {
      const label = (c.emoji ? c.emoji + " " : "") + t(c.key);
      const active = c.filter === state.filter ? " active" : "";
      return `<button class="chip${active}" data-filter="${esc(c.filter)}">${esc(label)}</button>`;
    }).join("");
    $("#chips").innerHTML = html;
    document.querySelectorAll(".chip").forEach(c => {
      c.addEventListener("click", () => setFilter(c.dataset.filter));
    });
  }

  function setFilter(f) {
    state.filter = f;
    state.visible = PAGE_SIZE;
    renderChips();
    render();
  }

  // ─── Header meta 行 ─────────────────────────────────────────────────────
  function setMetaLine({ count, lastRefreshed }) {
    const el = $("#metaLine");
    if (!lastRefreshed) {
      el.textContent = t("headerNever");
      return;
    }
    const rel = relativeTime(lastRefreshed) || t("justNow");
    el.textContent = t("headerStats", count, rel);
  }

  // ─── 取数据 ─────────────────────────────────────────────────────────────
  async function loadNews() {
    try {
      const r = await fetch("/api/news");
      const data = await r.json();
      state.articles = data.articles || [];
      state.lastRefreshed = data.last_refreshed || null;
      setMetaLine({ count: state.articles.length, lastRefreshed: state.lastRefreshed });
      render();
    } catch (e) {
      toast(t("toastLoadFailed", e.message));
    }
  }

  // ─── Refresh 按钮 + polling ────────────────────────────────────────────
  function setRefreshButton(busy) {
    const btn = $("#refresh");
    const label = btn.querySelector(".rr-label");
    btn.disabled = busy;
    btn.classList.toggle("spinning", busy);
    label.textContent = busy ? t("refreshing") : t("refresh");
  }

  function stopPolling() {
    if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
  }

  async function pollStatus() {
    try {
      const r = await fetch("/api/refresh/status");
      if (!r.ok) return;
      const s = await r.json();
      if (s.status === "running") return;
      stopPolling();
      state.refreshing = false;
      setRefreshButton(false);
      if (s.status === "done") {
        await loadNews();
        const stats = s.stats || {};
        const failed = s.sources_failed || [];
        let msg;
        if (failed.length) {
          msg = t("toastPartialFail", failed.join(", "));
        } else if (typeof stats.new === "number") {
          msg = stats.new > 0 ? t("toastAddedNew", stats.new) : t("toastNoNew");
        } else {
          msg = t("toastRefreshed");
        }
        toast(msg);
      } else if (s.status === "error") {
        toast(t("toastRefreshFailed", s.error || "unknown error"));
      }
    } catch (e) { /* 抖动,下一轮再试 */ }
  }

  async function doRefresh() {
    if (state.refreshing) return;
    setRefreshButton(true);
    try {
      const r = await fetch("/api/refresh", { method: "POST" });
      if (r.status === 429) {
        const err = await r.json().catch(() => ({}));
        toast((err.detail && err.detail.error) || t("toastRateLimited"));
        setRefreshButton(false);
        return;
      }
      if (r.status === 409) {
        state.refreshing = true;
        state.pollTimer = setInterval(pollStatus, 3000);
        return;
      }
      if (!r.ok) {
        const err = await r.json().catch(() => ({ detail: r.statusText }));
        throw new Error(err.detail || `HTTP ${r.status}`);
      }
      state.refreshing = true;
      state.pollTimer = setInterval(pollStatus, 3000);
    } catch (e) {
      toast(t("toastRefreshFailed", e.message));
      setRefreshButton(false);
    }
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stopPolling();
    else if (state.refreshing && !state.pollTimer) {
      pollStatus();
      state.pollTimer = setInterval(pollStatus, 3000);
    }
  });

  // ─── 翻译流:点击 → (en 选语种 / zh,ja 直接翻) → /api/translate → 渲染 ─
  function onTranslateClick(btn, url) {
    const lang = window.getUiLang();
    if (lang === "zh" || lang === "ja") {
      translateArticle(url, lang);
      return;
    }
    // EN 模式:弹小菜单
    document.querySelectorAll(".translate-menu").forEach(el => el.remove());
    const menu = document.createElement("div");
    menu.className = "translate-menu";
    menu.innerHTML = `
      <button type="button" data-lang="zh">${esc(t("pickChinese"))}</button>
      <button type="button" data-lang="ja">${esc(t("pickJapanese"))}</button>
    `;
    btn.closest(".translate-wrap").appendChild(menu);
    menu.querySelectorAll("button").forEach(b => {
      b.addEventListener("click", (e) => {
        e.stopPropagation();
        menu.remove();
        translateArticle(url, b.dataset.lang);
      });
    });
    // 点外面关闭
    setTimeout(() => {
      document.addEventListener("click", function close(ev) {
        if (!menu.contains(ev.target)) {
          menu.remove();
          document.removeEventListener("click", close);
        }
      });
    }, 0);
  }

  async function translateArticle(url, lang) {
    const card = document.querySelector(`article[data-url="${CSS.escape(url)}"]`);
    if (!card) return;
    const btn = card.querySelector(".translate-btn");
    const titleEl = card.querySelector(".title");
    const summaryEl = card.querySelector(".summary-en");
    const origTitle = titleEl.textContent;
    const origSummary = summaryEl.textContent;
    btn.disabled = true;
    btn.textContent = t("translating");
    try {
      const r = await fetch("/api/translate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ article_id: url, target_lang: lang }),
      });
      if (r.status === 429) {
        const err = await r.json().catch(() => ({}));
        toast((err.detail && err.detail.error) || t("toastRateLimited"));
        return;
      }
      if (!r.ok) {
        const err = await r.json().catch(() => ({ detail: r.statusText }));
        throw new Error(err.detail || `HTTP ${r.status}`);
      }
      const data = await r.json();
      titleEl.textContent   = data.title_translated;
      summaryEl.textContent = data.summary_translated;
      // 持久化到 localStorage:刷新页面也保持翻译态
      const states = getTranslatedStates();
      states[url] = {
        lang,
        title: data.title_translated,
        summary: data.summary_translated,
        orig_title: origTitle,
        orig_summary: origSummary,
      };
      setTranslatedStates(states);
      btn.classList.add("show-original");
      btn.textContent = t("showOriginal");
    } catch (e) {
      toast(t("toastTranslateFailed", e.message));
      btn.textContent = t("translate");
    } finally {
      btn.disabled = false;
    }
  }

  function revertTranslation(url) {
    const states = getTranslatedStates();
    const cached = states[url];
    if (!cached) return;
    const card = document.querySelector(`article[data-url="${CSS.escape(url)}"]`);
    if (card) {
      card.querySelector(".title").textContent = cached.orig_title;
      card.querySelector(".summary-en").textContent = cached.orig_summary;
      const btn = card.querySelector(".translate-btn");
      btn.classList.remove("show-original");
      btn.textContent = t("translate");
    }
    delete states[url];
    setTranslatedStates(states);
  }

  // ─── 语言切换:重渲染所有静态文案 + 卡片 + 筛选条 ───────────────────────
  function applyI18n() {
    document.title = t("pageTitle");
    $("#pageTitle").textContent = t("pageTitle");
    $("#refresh").querySelector(".rr-label").textContent =
      state.refreshing ? t("refreshing") : t("refresh");
    // 高亮当前激活的语言按钮
    document.querySelectorAll("#langSwitcher button").forEach(b => {
      b.classList.toggle("active", b.dataset.lang === window.getUiLang());
    });
    renderChips();
    setMetaLine({ count: state.articles.length, lastRefreshed: state.lastRefreshed });
    render();
  }

  function changeLang(lang) {
    window.setUiLang(lang);
    applyI18n();
  }

  // ─── 启动 ───────────────────────────────────────────────────────────────
  $("#refresh").addEventListener("click", doRefresh);
  document.querySelectorAll("#langSwitcher button").forEach(b => {
    b.addEventListener("click", () => changeLang(b.dataset.lang));
  });
  applyI18n();   // 应用当前语言到所有静态文案 + 筛选条
  loadNews();    // 拉数据并渲染
</script>
</body>
</html>
